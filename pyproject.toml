[project]
name = "moviebox-master"
version = "0.1.0"
description = "A local movie download manager with FastAPI and Flask"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "a2wsgi>=1.10,<2",
    "aiofiles>=24.1,<26",
    "aiohttp>=3.12,<4",
    "aiosqlite>=0.21,<1",
    "fastapi>=0.115,<1",
    "flask>=3.1,<4",
    "pydantic-settings>=2.8,<3",
    "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = ["httpx>=0.28,<1", "pytest>=8.3,<10", "pytest-asyncio>=1,<2", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
